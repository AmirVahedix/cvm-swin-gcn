name: cvm-swin-gcn

resources:
  cloud: vast
  accelerators: RTX3090:1
  disk_size: 10
  use_spot: true
  spot_bid_price: 0.25

file_mounts:
  ~/.env: .env
  
  ~/cvm-swin-gcn: .
  
  ~/cvm-swin-gcn/artifacts:
    name: ./artifacts
    mode: MOUNT
    source: local

setup: |
  cd ~/cvm-swin-gcn
  cp ~/.env .env
  pip install -r requirements.txt

run: |
  cd ~/cvm-swin-gcn

  python src/download_data.py
  
  python src/resize_images.py
  
  python src/generate_labels.py
  
  python src/split_dataset.py

  python src/train.py
  
  echo "Saving artifacts to mounted directory..."
  cp -r artifacts/* ~/local-storage/