name: cvm-swin-gcn


file_mounts:
  ~/.env: .env
  ~/cvm-swin-gcn: .

setup: |
  cd ~/cvm-swin-gcn
  cp ~/.env .env
  pip install -r requirements.txt

run: |
  cd ~/cvm-swin-gcn

  set -a; source .env; set +a

  python src/download_data.py
  python src/resize_images.py
  python src/generate_labels.py
  python src/split_dataset.py
  python src/train.py

  echo "Training complete. Destroying Vast instance..."
  curl -X DELETE "https://console.vast.ai/api/v0/instances/${VAST_INSTANCE_ID}/" \
       -H "Accept: application/json" \
       -H "Authorization: Bearer ${VAST_API_KEY}"
