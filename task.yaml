name: cvm-swin-gcn

resources:
  cloud: vast
  accelerators: RTX3090:1
  disk_size: 10

file_mounts:
  ~/.env: .env
  
  ~/cvm-swin-gcn: ./src
  
  ~/local-storage: 
    name: ./artifacts
    mode: MOUNT
    source: local

setup: |
  cd ~/cvm-swin-gcn
  cp ~/.env .env
  pip install -r requirements.txt

run: |
  cd ~/cvm-swin-gcn

  python download_data.py
  
  python resize_images.py
  
  python generate_labels.py
  
  python split_dataset.py

  python train.py
  
  echo "Saving artifacts to mounted directory..."
  cp -r artifacts/* ~/local-storage/